# Сайт «Личный турагент Ольга Дударева» — конфигурация nginx для российского сервера.
# Статику отдаёт сам nginx (быстро, с перемоткой видео), заявки — служба olgatour-api.
# Подстановка: DOMAIN и SITE_ROOT заменяются установщиком server/install.sh.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    # всё перенаправляем на https (сертификат ставит certbot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root SITE_ROOT;
    index index.html;
    charset utf-8;

    # заголовки безопасности
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # сжатие
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    client_max_body_size 8m;

    # заявки — в службу на localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # админка (Sveltia CMS)
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # файлы подписки на календарь
    location ~* \.(ics|xml)$ {
        types { }
        default_type text/calendar;
        add_header Cache-Control "public, max-age=900";
    }

    # видео и крупные файлы: перемотка (Range) работает из коробки, ускоряем отдачу
    location ~* \.(mp4|webm|webp|jpg|jpeg|png|avif|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # собранные скрипты и стили с хешем в имени — кэш на год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # страницы с «красивыми» адресами: /napravleniya/ → napravleniya/index.html
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
